name: Mirror releases to archive.org

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to mirror"
        type: choice
        options: [all, kernels, isos]
        default: all
      dry_run:
        description: "Plan only (no download/upload)"
        type: boolean
        default: false
      limit:
        description: "Max releases this run (0 = no limit)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: mirror-archive
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install internetarchive
        run: pip install --quiet internetarchive

      - name: Prepare large temp space (ISO is multi-GB)
        run: |
          sudo mkdir -p /mnt/mirror-tmp
          sudo chmod 777 /mnt/mirror-tmp
          echo "TMPDIR=/mnt/mirror-tmp" >> "$GITHUB_ENV"

      - name: Mirror to archive.org
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          python tools/mirror-to-archive.py \
            --target "${{ inputs.target }}" \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Commit manifest updates
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "arxos-mirror[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernels.json isos.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "mirror: record archive.org URLs [skip ci]"
            # A scan can run for an hour; anything else landing on main in that window
            # would otherwise reject this push and silently lose the record of an upload
            # that already succeeded. Rebase and retry instead of failing.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $attempt"; exit 0
              fi
              echo "push rejected, rebasing onto latest main (attempt $attempt)"
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
            echo "could not push the manifest after 5 attempts"; exit 1
          fi
