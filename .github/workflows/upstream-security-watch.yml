name: upstream kernel security watch

# The watchdog over the automatic kernel pipeline. kernel-build.yml builds every flavour when
# kernel.org releases, and the private publisher puts it on R2 and in kernels.json. This checks the
# result once a day: when any current flavour (linux-arxos, -rt, -zen) is behind kernel.org's latest
# stable, or sits on a branch upstream marked end of life, it opens (or updates) one issue; when all
# are caught up again it closes that issue. It builds nothing. Actions are pinned to commits.

on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare every published flavour with upstream stable
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const up = await (await fetch('https://www.kernel.org/releases.json')).json();
            const ours = await (await fetch('https://raw.githubusercontent.com/thearxos/arxos-kernels/main/kernels.json')).json();

            const stable = up.latest_stable.version;                 // e.g. "7.3.3"
            const eolBranches = new Set(up.releases.filter(r => r.iseol).map(r => r.version.split('.').slice(0,2).join('.')));
            const cmp = (a, b) => {                                   // numeric version compare
              const pa = a.split('-')[0].split('.').map(Number), pb = b.split('-')[0].split('.').map(Number);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const d = (pa[i] || 0) - (pb[i] || 0);
                if (d) return d;
              }
              return 0;
            };

            // the newest published build of each shipped flavor that is marked current
            const current = (ours.kernels || []).filter(k => k.status === 'current');
            const problems = [];
            if (!current.some(k => k.flavor === 'linux-arxos'))
              problems.push('**linux-arxos** has no current release in kernels.json.');
            for (const k of current) {
              if (cmp(stable, k.version) > 0)
                problems.push(`**${k.flavor}** is ${k.version} but upstream stable is **${stable}** (behind, security fixes pending). kernel-build.yml builds it on its next run; if this issue stays open past a day, look at the open \`build-failure\` issues and the kernel-build runs.`);
            }
            for (const k of current) {
              const branch = k.version.split('.').slice(0,2).join('.');
              if (eolBranches.has(branch))
                problems.push(`**${k.flavor}** ${k.version} is on branch ${branch}.x, which upstream has marked **END OF LIFE** - it gets no more security fixes. Move it to the current stable or an LTS longterm branch.`);
            }

            const open = (await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'kernel-security' })).data;
            if (!problems.length) {
              const have = current.map(k => `${k.flavor} ${k.version}`).join(', ');
              core.info(`up to date with upstream stable ${stable}: ${have}`);
              for (const i of open) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: `Caught up: ${have} (upstream stable ${stable}).` });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed' });
                core.notice(`closed issue #${i.number}`);
              }
              return;
            }

            const title = `kernel security: linux-arxos behind upstream (stable ${stable})`;
            const body = [`Upstream stable is **${stable}**. Published ArxOS kernels need attention so users keep receiving official Linux security patches:\n`, ...problems.map(p => `- ${p}`), `\n_Raised automatically by upstream-security-watch. Kernels build, gate, boot-test and publish by themselves (kernel-build.yml, then the publisher); this issue closes itself when every flavour is caught up._`].join('\n');
            const existing = open[0];
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, title, body });
              core.notice(`updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['kernel-security'] });
              core.notice(`opened issue #${created.data.number}`);
            }
            core.setFailed(problems.join(' '));   // red run = a kernel security rebuild is due
