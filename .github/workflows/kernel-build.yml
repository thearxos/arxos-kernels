name: Build ARXOS kernels when upstream releases

# Every four hours this asks akt which kernel version a build would produce now. When that
# version has no release here yet, both flavours are built with the release profile, checked
# (the patches here must be the ones akt applies, the hardening gate, then a real boot that must
# reach userspace with taint 0 and no warning) and published here as one GitHub release per
# flavour with SHA-256 sums. Nothing in these jobs holds a secret: R2 and kernels.json are
# updated by a separate private publisher that reads these releases and checks every hash again
# before it uploads anything; its kernels.json push then starts the archive.org mirror.
#
# akt (the kernel builder, github.com/0xb0rn3/kernel-builder) is pinned to one commit, so a
# change to the tool reaches the kernels only when this file is updated on purpose.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when releases for this version already exist"
        type: boolean
        default: false
      pkgrel:
        description: "Package revision (raise it to rebuild the same upstream version)"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: kernel-build
  cancel-in-progress: false

env:
  AKT_REPO: 0xb0rn3/kernel-builder
  AKT_REF: 1bb8c3b052928e03a05d8bc5d9e0f8a85f81ab81

jobs:
  check:
    name: Is there a new upstream release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.up.outputs.version }}
      recipe: ${{ steps.up.outputs.recipe }}
      build: ${{ steps.up.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.AKT_REPO }}
          ref: ${{ env.AKT_REF }}
          path: akt
      - name: Build akt
        working-directory: akt
        run: cargo build --release --locked
      - name: Compare upstream with what is released here
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          [[ "$PKGREL" =~ ^[0-9]+$ ]] || { echo "pkgrel must be a number" >&2; exit 1; }
          json=$(./akt/target/release/akt upstream --json)
          version=$(jq -r .version <<<"$json"); recipe=$(jq -r .recipe <<<"$json")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$recipe" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected upstream answer: $json" >&2; exit 1; }
          build=false
          for p in linux-arxos linux-arxos-rt; do
            gh release view "$p-$version-$PKGREL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || build=true
          done
          [ "$FORCE" = true ] && build=true
          { echo "version=$version"; echo "recipe=$recipe"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
          echo "upstream $version (source $recipe), releases $version-$PKGREL: build=$build" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.package }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: default
            kname: arxos
            package: linux-arxos
          - flavor: rt
            kname: arxos-rt
            package: linux-arxos-rt
    env:
      KERNEL_FLAVOR: ${{ matrix.flavor }}
      KERNEL_NAME: ${{ matrix.kname }}
      PACKAGE: ${{ matrix.package }}
      SOURCE_REF: ${{ needs.check.outputs.recipe }}
      VERSION: ${{ needs.check.outputs.version }}
      PKGREL: ${{ inputs.pkgrel || '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: kernels
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.AKT_REPO }}
          ref: ${{ env.AKT_REF }}
          path: akt

      - name: The published patches are the ones akt applies
        run: |
          set -euo pipefail
          diff -r kernels/patches/arxos akt/patches/arxos
          (cd akt/patches/arxos && sha256sum -c SHA256SUMS)

      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          # the build tree is about 30 GB: it goes on the runner's scratch disk when there is one
          best=$RUNNER_TEMP; free=$(df --output=avail -k "$RUNNER_TEMP" | tail -1)
          if sudo mkdir -p /mnt/akt-work 2>/dev/null && [ "$(df --output=avail -k /mnt | tail -1)" -gt "$free" ]; then best=/mnt; fi
          work="$best/akt-work"; sudo mkdir -p "$work"; sudo chmod 777 "$work"; echo "AKT_CACHE=$work" >> "$GITHUB_ENV"
          df -h / "$work"
          nproc; free -g | sed -n 2p

      - name: Build the package with akt (release profile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/akt:/workspace" \
            --volume "$GITHUB_WORKSPACE/artifacts:/out" \
            --volume "$AKT_CACHE:/home/builder/.cache" \
            --workdir /workspace \
            --env SOURCE_REF --env KERNEL_FLAVOR --env KERNEL_NAME --env PKGREL --env PACKAGE \
            archlinux:base-devel \
            bash -Eeuo pipefail -c '
              pacman -Syu --noconfirm --needed rust git clang llvm lld bc cpio pahole python sudo zstd libarchive
              if ! getent passwd builder >/dev/null 2>&1; then useradd --create-home builder; fi
              chown builder:builder /home/builder /home/builder/.cache
              cargo build --release --locked
              chown -R builder:builder /out
              chmod 777 /out
              # The source recipe signing keys, by full fingerprint. The recipe validpgpkeys list stays
              # the trust anchor; no signature or checksum check is skipped.
              sudo -u builder -- env HOME=/home/builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 E8B9AA39F054E30E8290D492C3C4820857F654FE
              # the release profile: x86-64-v3, 1000 Hz, madvise huge pages, the bundled ARXOS patches;
              # akt sizes the compile and link jobs to the runner itself
              args=(build --target-distro arch --flavor "$KERNEL_FLAVOR" --name "$KERNEL_NAME" --cpu-target v3 --hz 1000 --hugepages madvise --pkgrel "$PKGREL" --source-ref "$SOURCE_REF" --out /out)
              sudo -u builder -- env HOME=/home/builder XDG_CACHE_HOME=/home/builder/.cache AKT_DATA_DIR=/workspace AKT_WORK=/home/builder/.cache/akt AKT_MIN_DISK_GIB=45 /workspace/target/release/akt "${args[@]}"
              # the hardening gate, on the configuration that is inside the package
              hdr=$(find /out -maxdepth 1 -name "${PACKAGE}-headers-*.pkg.tar.zst" -print -quit)
              test -n "$hdr"
              mkdir -p /tmp/cfg && bsdtar -xf "$hdr" -C /tmp/cfg "usr/lib/modules/*/build/.config"
              cfg=$(find /tmp/cfg -name .config -print -quit)
              /workspace/target/release/akt gate "$cfg" | tee /out/${PACKAGE}-gate.txt
              grep -q "GREEN" /out/${PACKAGE}-gate.txt
            '
          sudo chown -R "$(id -u):$(id -g)" artifacts
          ls -la artifacts

      - name: The package is the version that was asked for
        run: |
          set -euo pipefail
          test -f "artifacts/${PACKAGE}-${VERSION}-${PKGREL}-x86_64.pkg.tar.zst"
          test -f "artifacts/${PACKAGE}-headers-${VERSION}-${PKGREL}-x86_64.pkg.tar.zst"

      - name: Boot it (must reach userspace with taint 0 and no warning)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes -qq qemu-system-x86 busybox-static cpio zstd libarchive-tools
          pkg="artifacts/${PACKAGE}-${VERSION}-${PKGREL}-x86_64.pkg.tar.zst"
          tmp=$(mktemp -d)
          bsdtar -xf "$pkg" -C "$tmp" 'usr/lib/modules/*/vmlinuz'
          kernel=$(find "$tmp" -name vmlinuz -print -quit)
          root="$tmp/root"; mkdir -p "$root"/{bin,proc,sys,dev}
          cp /usr/bin/busybox "$root/bin/busybox"
          # The results go to the second serial port, which nothing else writes to: on the first
          # one, kernel messages printed at the same moment cut into them.
          cat > "$root/init" <<'INIT'
          #!/bin/busybox sh
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sys /sys
          /bin/busybox mount -t devtmpfs dev /dev
          /bin/busybox mount -t securityfs securityfs /sys/kernel/security
          {
            echo "KBOOT uname=$(/bin/busybox uname -r)"
            echo "KBOOT taint=$(/bin/busybox cat /proc/sys/kernel/tainted)"
            echo "KBOOT lockdown=$(/bin/busybox cat /sys/kernel/security/lockdown)"
            echo "KBOOT build=$(/bin/busybox uname -v)"
            echo "KBOOT userspace=ok"
          } > /dev/ttyS1
          /bin/busybox sync
          /bin/busybox poweroff -f
          INIT
          sed -i 's/^          //' "$root/init"; chmod +x "$root/init"
          (cd "$root" && find . | cpio -o -H newc 2>/dev/null | gzip -1 > "$tmp/initrd.gz")
          # hardware virtualisation when the runner offers it, emulation otherwise (x86-64-v3 both ways)
          accel=(-accel tcg -cpu max); budget=900
          if [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm 2>/dev/null; then accel=(-enable-kvm -cpu host); budget=180; fi
          log="artifacts/${PACKAGE}-boot.log"; res="artifacts/${PACKAGE}-boot-result.txt"
          timeout "$budget" qemu-system-x86_64 "${accel[@]}" -m 2048 -smp 2 -display none -no-reboot -nic none \
            -monitor none -serial "file:$log" -serial "file:$tmp/result.raw" \
            -kernel "$kernel" -initrd "$tmp/initrd.gz" \
            -append "console=ttyS0 ignore_loglevel panic=1 lockdown=integrity rdinit=/init" || true
          # a serial line ends in CR LF
          tr -d '\r' < "$tmp/result.raw" > "$res" 2>/dev/null || : > "$res"
          cat "$res"
          grep -aqx "KBOOT userspace=ok" "$res" 2>/dev/null || { tail -40 "$log"; echo "the kernel did not reach userspace" >&2; exit 1; }
          grep -aqx "KBOOT uname=${VERSION}-${PKGREL}-${KERNEL_NAME}" "$res" || { echo "the booted kernel is not ${VERSION}-${PKGREL}-${KERNEL_NAME}" >&2; exit 1; }
          # A kernel warning or crash prints one of these. Hardware advisories ("Speculative Return
          # Stack Overflow: WARNING: See ...", about the runner's CPU) are not kernel faults.
          splat='WARNING: CPU:|\[ cut here \]|BUG:|Oops|Kernel panic|Call Trace:'
          grep -aqx "KBOOT taint=0" "$res" || { grep -a -E "$splat" "$log" | head; echo "the kernel is tainted" >&2; exit 1; }
          grep -aqx "KBOOT lockdown=none \[integrity\] confidentiality" "$res" || { echo "lockdown is not in integrity mode" >&2; exit 1; }
          if grep -a -E "$splat" "$log"; then echo "the kernel log holds a warning" >&2; exit 1; fi
          echo "PASS: ${PACKAGE} ${VERSION}-${PKGREL} boots with taint 0, lockdown integrity, no warnings" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish the releases
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: One release per flavour
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          RECIPE: ${{ needs.check.outputs.recipe }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
        run: |
          set -euo pipefail
          for p in linux-arxos linux-arxos-rt; do
            out="out-$p"; mkdir "$out"
            for f in "$p-$VERSION-$PKGREL-x86_64.pkg.tar.zst" "$p-headers-$VERSION-$PKGREL-x86_64.pkg.tar.zst" "$p-gate.txt" "$p-boot.log"; do
              src=$(find "dl/$p" -name "$f" -print -quit); test -n "$src" || { echo "missing $f" >&2; exit 1; }
              cp "$src" "$out/"
            done
            (cd "$out" && sha256sum *.pkg.tar.zst > SHA256SUMS && cat SHA256SUMS)
            tag="$p-$VERSION-$PKGREL"
            {
              echo "$p $VERSION-$PKGREL, built from Linux $VERSION by akt ${AKT_REF::7}."
              echo
              echo "It passed the hardening gate and a boot that reached userspace with taint 0, lockdown in integrity mode and no warning in the kernel log (log attached)."
              echo
              echo "Source commit: \`${RECIPE}\`. Verify a download against \`SHA256SUMS\` before installing. Install it with: \`arx kernel install $p\`."
            } > notes.md
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" "$out"/* --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$tag" "$out"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$p $VERSION-$PKGREL" --notes-file notes.md --latest=false
            fi
          done
